{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Secure Chat{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/vendor/alertify.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/semantic.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vendor/terminal.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="terminal">

<nav class="topbar">
  <a href="{% url 'home' %}" class="brand">
    Secure<span class="brand-brace">{</span>chat<span class="brand-brace">}</span>
  </a>

  <div class="topbar-right">
    {% if request.user.is_authenticated %}
      <a href="{% url 'chat:index' %}" class="topbar-link">CHAT</a>
      <a href="{% url 'account' %}" class="topbar-link">ACCOUNT</a>
      <form method="post" action="{% url 'logout' %}" class="topbar-logout"
            data-confirm="Log out?"
            data-confirm-ok="LOGOUT">
        {% csrf_token %}
        <button class="topbar-link">LOGOUT</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="topbar-link">LOGIN</a>
      <a href="{% url 'register' %}" class="topbar-link">REGISTER</a>
    {% endif %}
  </div>
</nav>

<main class="page">
  {% block content %}
  {% endblock %}
</main>

{% if messages %}
<script id="django-messages" type="application/json">
[
{% for message in messages %}
{"level": "{{ message.tags|escapejs }}", "text": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}
{% endfor %}
]
</script>
{% endif %}

<script src="{% static 'js/vendor/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'js/vendor/alertify.min.js' %}"></script>
<script src="{% static 'js/confirm.js' %}"></script>
<script src="{% static 'js/presence.js' %}"></script>
<script src="{% static 'js/chat.js' %}"></script>

<script>
(function () {
  var el = document.getElementById("django-messages");
  if (!el) return;
  var payload;
  try { payload = JSON.parse(el.textContent); } catch (e) { return; }
  if (!Array.isArray(payload)) return;
  payload.forEach(function (m) {
    var text = m.text || "";
    if (m.level === "success") alertify.success(text);
    else if (m.level === "error") alertify.error(text);
    else if (m.level === "warning") alertify.warning(text);
    else alertify.message(text);
  });
})();

document.addEventListener("keydown", function (e) {
  if (e.target.matches("input, textarea")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "/") {
    var input = document.getElementById("chat-message-input");
    if (input && !input.disabled) {
      e.preventDefault();
      input.focus();
    }
  }
});
</script>

{% block scripts %}{% endblock %}

</body>
</html>
