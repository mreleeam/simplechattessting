<div class="home-panel">

  <div class="button-group">

    {% if request.user.is_authenticated %}

        <a href="{% url 'account' %}" class="btn btn-default">
            ACCOUNT
        </a>

        <a href="{% url 'chat:index' %}" class="btn btn-default">
            CHAT
        </a>

    {% else %}

        <a href="{% url 'login' %}" class="btn btn-default">
            LOGIN
        </a>

        <a href="{% url 'register' %}" class="btn btn-default">
            REGISTER
        </a>

    {% endif %}

  </div>

  <div class="terminal-card">

    <p>

      <span class="status-label">
        USER STATUS
      </span>

      &gt;

      {% if request.user.is_authenticated %}

      <span class="status-connected">
        CONNECTED
      </span>

      {% else %}

      <span class="status-disconnected">
        NOT CONNECTED
      </span>

      {% endif %}

    </p>

    <br>

    <p>✓ Privacy-first design</p>
    <p>✓ Text-only communication</p>
    <p>✓ Minimal attack surface</p>
    <p>✓ Open source</p>

  </div>

</div>
