{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth-box">

  <h1 class="terminal-title">
    LOGGING IN...<span class="cursor">|</span>
  </h1>

  <form method="post">

    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">


    <input type="password" name="password" placeholder="Password">


    <button type="submit">
      CONNECT
    </button>

    <p class="auth-link">
    Don't have an account?
    <a href="{% url 'register' %}">Create one!</a>
    </p>

  </form>

</div>



{% endblock %}
